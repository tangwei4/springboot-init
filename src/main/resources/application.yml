spring:
  application:
    name: springboot-init
  # Redis 配置
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # 多数据源配置
  datasource:
    dynamic:
      # 默认数据源（必须配置）
      primary: source
      # 严格匹配数据源，默认false. true未匹配到指定数据源时抛异常，false使用默认数据源
      strict: false
      datasource:
        # 数据源1：source_db (对应你 Docker 的 3306)
        source:
          url: jdbc:mysql://127.0.0.1:3306/source_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: Root@123456
          driver-class-name: com.mysql.cj.jdbc.Driver

        # 数据源2：target_db (对应你 Docker 的 3307)
        target:
          url: jdbc:mysql://127.0.0.1:3307/target_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: Root@123456
          driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置（可选）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0